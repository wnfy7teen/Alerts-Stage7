name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - design/light-brand-palette
      - 'fix/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-e2e.txt
      - name: Lint
        run: ruff check .
      - name: Validate operations scripts
        run: |
          bash -n scripts/remote_backup.sh scripts/healthcheck.sh
          python -m py_compile scripts/restore_drill.py
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt -r requirements-e2e.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Unit and browser tests
        run: pytest -q tests e2e

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: donation-alerts-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_HOST"
          ssh -T \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "deploy@$DEPLOY_HOST"
      - name: Verify public donation page on both domains
        run: |
          set -euo pipefail
          for HOST in vanesso4ka.site www.vanesso4ka.site; do
            URL="https://${HOST}/?deploy_check=${GITHUB_SHA}"
            OUT="/tmp/donation-page-${HOST}.html"
            echo "Checking ${URL}"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
              -H "Cache-Control: no-cache, no-store" \
              -H "Pragma: no-cache" \
              "${URL}" -o "${OUT}"
            for EXPECTED in \
              'DESIGNED &amp; DEVELOPED BY' \
              'Krisofer Biksan' \
              'Web Developer · Technical Support' \
              'mailto:usdtuser1@proton.me' \
              'https://t.me/web3ResearchCN' \
              '© 2026 Kristofer Biksan. All rights reserved.'; do
              if ! grep -Fq "${EXPECTED}" "${OUT}"; then
                echo "::error::${HOST} does not serve expected footer content: ${EXPECTED}"
                exit 1
              fi
            done
            echo "${HOST}: expected developer footer verified."
          done

      - name: Verify public application health endpoint
        run: |
          set -euo pipefail
          for HOST in vanesso4ka.site www.vanesso4ka.site; do
            URL="https://${HOST}/api/health?deploy_check=${GITHUB_SHA}"
            OUT="/tmp/health-${HOST}.json"
            echo "Checking ${URL}"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
              -H "Cache-Control: no-cache, no-store" \
              -H "Pragma: no-cache" \
              "${URL}" -o "${OUT}"
            python - "${OUT}" "${HOST}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("status") == "ok", f"{sys.argv[2]} health endpoint returned unexpected payload: {payload!r}"
          print(f"{sys.argv[2]}: application health is ok.")
          PY
          done

      - name: Verify public SEO endpoints and metadata
        run: |
          set -euo pipefail
          BASE="https://vanesso4ka.site"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$BASE/robots.txt" -o /tmp/robots.txt
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$BASE/sitemap.xml" -o /tmp/sitemap.xml
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$BASE/llms.txt" -o /tmp/llms.txt
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$BASE/yandex_f635b5b1368c3ec6.html" -o /tmp/yandex-verification.html
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$BASE/" -o /tmp/homepage.html
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          base = "https://vanesso4ka.site"
          robots = Path("/tmp/robots.txt").read_text(encoding="utf-8")
          sitemap_text = Path("/tmp/sitemap.xml").read_text(encoding="utf-8")
          llms = Path("/tmp/llms.txt").read_text(encoding="utf-8")
          yandex_verification = Path("/tmp/yandex-verification.html").read_text(encoding="utf-8")
          homepage = Path("/tmp/homepage.html").read_text(encoding="utf-8")

          assert f"Sitemap: {base}/sitemap.xml" in robots, "robots.txt must advertise the canonical sitemap"
          assert "Verification: f635b5b1368c3ec6" in yandex_verification, "Yandex Webmaster verification file is missing or incorrect"
          for bot in ("GPTBot", "OAI-SearchBot", "ChatGPT-User", "ClaudeBot", "Claude-SearchBot", "Claude-User", "PerplexityBot"):
              assert f"User-agent: {bot}" in robots, f"robots.txt missing crawler group: {bot}"

          root = ET.fromstring(sitemap_text)
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          assert root.tag == ns + "urlset", "sitemap root must be the standard urlset element"
          assert all(child.tag == ns + "url" for child in root), "sitemap must contain only url entries"
          urls = root.findall(ns + "url")
          assert len(urls) == 1, f"expected one public URL, got {len(urls)}"
          assert urls[0].findtext(ns + "loc") == base + "/", "sitemap URL must use the canonical homepage"
          assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", urls[0].findtext(ns + "lastmod") or ""), "sitemap lastmod must be YYYY-MM-DD"
          assert "<script" not in sitemap_text.lower(), "unexpected script element in XML sitemap"

          assert llms.startswith("# "), "llms.txt must start with a Markdown H1"
          assert "## Страницы" in llms and f"({base}/)" in llms, "llms.txt must describe the canonical public page"

          class SEOParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = ""
                  self.in_title = False
                  self.meta = {}
                  self.canonical = None
                  self.jsonld = []
                  self.in_jsonld = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "title":
                      self.in_title = True
                  if tag == "meta":
                      key = attrs.get("name") or attrs.get("property")
                      if key:
                          self.meta[key] = attrs.get("content", "")
                  if tag == "link" and attrs.get("rel") == "canonical":
                      self.canonical = attrs.get("href")
                  if tag == "script" and attrs.get("type") == "application/ld+json":
                      self.in_jsonld = True
              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False
                  if tag == "script":
                      self.in_jsonld = False
              def handle_data(self, data):
                  if self.in_title:
                      self.title += data
                  if self.in_jsonld:
                      self.jsonld.append(data)

          parser = SEOParser()
          parser.feed(homepage)
          assert parser.title.strip() and len(parser.title) <= 60, "homepage title is missing or too long"
          assert parser.meta.get("description") and len(parser.meta["description"]) <= 160, "meta description is missing or too long"
          assert parser.meta.get("robots", "").startswith("index"), "homepage must be indexable"
          assert parser.meta.get("msvalidate.01") == "1656712732A8B6F806D5737CCDB19855", "Bing Webmaster verification meta tag is missing or incorrect"
          assert parser.canonical == base + "/", "homepage canonical URL must use the apex HTTPS domain"
          graph = json.loads("".join(parser.jsonld))
          kinds = {item.get("@type") for item in graph.get("@graph", [])}
          assert {"WebSite", "Person", "WebPage"} <= kinds, "JSON-LD graph is missing core entity types"
          print("SEO smoke checks passed: robots, sitemap XML, llms.txt, canonical metadata and JSON-LD.")
          PY
