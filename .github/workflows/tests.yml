name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - design/light-brand-palette
      - 'fix/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-e2e.txt
      - name: Lint
        run: ruff check .
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Unit and browser tests
        run: pytest -q tests e2e

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: donation-alerts-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_HOST"
          ssh -T \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "deploy@$DEPLOY_HOST"
      - name: Verify public donation page on both domains
        run: |
          set -euo pipefail
          for HOST in vanesso4ka.site www.vanesso4ka.site; do
            URL="https://${HOST}/?deploy_check=${GITHUB_SHA}"
            OUT="/tmp/donation-page-${HOST}.html"
            echo "Checking ${URL}"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
              -H "Cache-Control: no-cache, no-store" \
              -H "Pragma: no-cache" \
              "${URL}" -o "${OUT}"
            for EXPECTED in \
              'DESIGNED &amp; DEVELOPED BY' \
              'Krisofer Biksan' \
              'Web Developer · Technical Support' \
              'mailto:usdtuser1@gmail.com' \
              'https://t.me/web3ResearchCN' \
              '© 2026 Kristofer Biksan. All rights reserved.'; do
              if ! grep -Fq "${EXPECTED}" "${OUT}"; then
                echo "::error::${HOST} does not serve expected footer content: ${EXPECTED}"
                exit 1
              fi
            done
            echo "${HOST}: expected developer footer verified."
          done
