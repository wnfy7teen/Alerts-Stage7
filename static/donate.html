<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{HEAD}}
<link rel="stylesheet" href="/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: flex; justify-content: center; padding: 28px 20px;
    background: radial-gradient(ellipse at 12% 4%, rgba(112, 92, 255, .20), transparent 38%),
      radial-gradient(ellipse at 88% 28%, rgba(65, 145, 255, .12), transparent 34%), var(--bg);
    color: var(--text); font-family: "Onest", system-ui, sans-serif; }
  .page { width: 100%; max-width: 460px; }
  main { display: grid; gap: 16px; }
  .faq { padding: 8px 2px 0; }
  .faq h2 { font-family: "Unbounded", "Onest", sans-serif; font-size: 18px; margin: 12px 0 14px; }
  .faq-list { border-top: 1px solid var(--line); }
  .faq-item { border-bottom: 1px solid var(--line); }
  .faq-item summary { display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 58px; padding: 12px 2px; color: var(--text); font-size: 14px; font-weight: 600;
    line-height: 1.45; cursor: pointer; list-style: none; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .faq-chevron { width: 8px; height: 8px; flex: 0 0 8px; margin: 0 4px 4px 0;
    border-right: 1.7px solid var(--action); border-bottom: 1.7px solid var(--action);
    transform: rotate(45deg); transition: transform .22s ease; }
  .faq-item[open] .faq-chevron { transform: rotate(225deg); margin-bottom: -4px; }
  .faq-answer > div { overflow: hidden; }
  .faq-answer p { color: var(--muted); margin: 0; padding: 0 24px 16px 2px; font-size: 14px; line-height: 1.65; }
  .faq-item[open] .faq-answer { animation: faq-reveal .22s ease both; }
  @keyframes faq-reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .faq-chevron, .faq-answer { transition: none; animation: none; }
  }
  footer { margin-top: 24px; color: var(--muted); font-size: 13px; }
  .links { list-style: none; display: flex; gap: 16px; padding: 0; margin: 0 0 8px; }
  .links a { color: var(--action); display: inline-block; padding: 10px 0; }
  .ts-on { min-height: 65px; }
  h1 { font-family: "Unbounded", "Onest", sans-serif; font-weight: 800; font-size: 26px; margin: 0 0 6px; overflow-wrap: anywhere; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 16px; }
  label, legend { font-weight: 600; font-size: 14px; }
  label { display: grid; gap: 6px; }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
  input[type=text], input[type=number], textarea { width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: inherit; font-weight: 400; }
  textarea { resize: vertical; min-height: 84px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, .method input:focus-visible + .card {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  .amount { display: flex; align-items: baseline; gap: 10px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 16px; }
  .amount:focus-within { outline: 2px solid var(--accent); }
  .amount input { border: 0; padding: 4px 0; background: transparent; outline: none !important;
    font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 34px; }
  .amount span { font-family: "Unbounded", sans-serif; font-size: 28px; color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 16px; min-height: 44px; font: inherit; cursor: pointer; }
  .chips button:hover, .chips button[aria-pressed=true] { border-color: var(--accent); background: var(--panel-soft); }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; display: flex; justify-content: space-between; }
  .methods { display: grid; gap: 8px; }
  .method { position: relative; }
  .method input { position: absolute; opacity: 0; inset: 0; }
  .method .card { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .method input:checked + .card { border-color: var(--accent); background: var(--panel-soft); }
  .method .card small { color: var(--muted); font-weight: 400; }
  .pay { display: block; width: 100%; text-align: center; text-decoration: none; background: var(--action); color: var(--brand-white);
    border: 0; border-radius: 12px; padding: 15px; min-height: 48px; font: inherit; font-weight: 800; font-size: 17px; cursor: pointer; }
  .pay:disabled { opacity: .6; cursor: wait; }
  .ghost { background: transparent; color: var(--action); border: 0; font: inherit; text-decoration: underline; cursor: pointer; padding: 10px; min-height: 44px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  #err { color: var(--error); min-height: 1.2em; margin: 0; font-size: 14px; }
  .status { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .spin { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #yk-form { background: #fff; border-radius: 12px; padding: 4px; min-height: 120px; }
  .checkout-stack { display: grid; gap: 14px; }
  .checkout-note { margin: 0; }
  .addr { font-family: ui-monospace, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; overflow-wrap: anywhere; font-size: 14px; }
  .qr { display: block; margin: 0 auto; width: 200px; height: 200px; background: #fff; border-radius: 10px; padding: 8px; }
  .big { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 22px; overflow-wrap: anywhere; }
  .result { text-align: center; }
  .result h2 { font-family: "Unbounded", sans-serif; font-size: 22px; margin: 8px 0; }
  .result p { color: var(--muted); margin: 0 0 6px; }
  .tick { width: 84px; height: 84px; margin: 0 auto; }
  .tick circle { fill: none; stroke: var(--ok); stroke-width: 4; stroke-dasharray: 190; stroke-dashoffset: 190; animation: draw .7s ease forwards; }
  .tick path { fill: none; stroke: var(--ok); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: draw .5s .55s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .cross { font-size: 56px; line-height: 1; color: var(--error); }
  @media (prefers-reduced-motion: reduce) { .tick circle, .tick path { animation-duration: .01s; animation-delay: 0s; } .spin { animation-duration: 3s; } }

  /* Aurora overrides: keep these after base component rules. */
  .page { position: relative; }
  header { padding: 12px 4px 8px; }
  h1 { letter-spacing: -.045em; background: linear-gradient(110deg, #fff 8%, #c9c1ff 58%, #91caff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { max-width: 38ch; line-height: 1.6; }
  .box { background: linear-gradient(145deg, rgba(31, 35, 57, .84), rgba(15, 18, 31, .78));
    border: 1px solid rgba(190, 195, 238, .18); border-radius: 20px; padding: 24px;
    box-shadow: 0 18px 55px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255, 255, 255, .045);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  input[type=text], input[type=number], textarea { background: var(--surface-input); border-color: rgba(190, 195, 238, .19);
    border-radius: 12px; transition: border-color .18s ease, box-shadow .18s ease; }
  input[type=text]:focus, input[type=number]:focus, textarea:focus { border-color: rgba(169, 155, 255, .72);
    box-shadow: 0 0 0 3px rgba(169, 155, 255, .12); }
  .amount { background: rgba(8, 10, 18, .58); border-color: rgba(190, 195, 238, .2); border-radius: 14px; }
  .amount span { color: #BDB3FF; }
  .chips button { background: rgba(255, 255, 255, .025); border-color: rgba(190, 195, 238, .18);
    transition: background .18s ease, border-color .18s ease, transform .18s ease; }
  .chips button:hover { transform: translateY(-1px); }
  .chips button:hover, .chips button[aria-pressed=true] { border-color: rgba(169, 155, 255, .72);
    background: rgba(169, 155, 255, .13); }
  .method .card { background: rgba(8, 10, 18, .28); border-color: rgba(190, 195, 238, .17);
    border-radius: 14px; transition: border-color .18s ease, background .18s ease, transform .18s ease; }
  .method .card:hover { transform: translateY(-1px); border-color: rgba(169, 155, 255, .45); }
  .method input:checked + .card { border-color: #A99BFF; background: rgba(169, 155, 255, .14);
    box-shadow: inset 0 0 0 1px rgba(169, 155, 255, .12), 0 0 24px rgba(130, 110, 255, .08); }
  .pay { color: #0B0C16; background: linear-gradient(105deg, #C4B9FF, #9CCBFF);
    border-radius: 13px; box-shadow: 0 8px 24px rgba(143, 129, 255, .2);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease; }
  .pay:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06);
    box-shadow: 0 12px 30px rgba(143, 129, 255, .28); }
  .ghost { color: #C2B9FF; }
  .faq { padding: 10px 4px 0; }
  .faq h2 { letter-spacing: -.025em; }
  .faq-list { border-color: rgba(190, 195, 238, .14); }
  .faq-item { border-color: rgba(190, 195, 238, .14); }
  .faq-chevron { border-color: #BDB3FF; }
  footer { padding: 0 4px; }
  .links a { color: #C2B9FF; }
  .status { padding: 10px 2px; }
  .addr { background: rgba(8, 10, 18, .65); border-color: rgba(190, 195, 238, .18); }
  .result { text-align: center; }
  @media (max-width: 520px) {
    body { padding: 16px 12px; }
    .box { padding: 19px; border-radius: 17px; }
    h1 { font-size: clamp(22px, 7vw, 26px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chips button, .method .card, .pay, input, textarea { transition: none; }
  }

</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="title">{{H1}}</h1>
    <p class="sub">{{INTRO}}</p>
  </header>
  <noscript><p class="sub">Для оплаты нужен включённый JavaScript.</p></noscript>
  <main>
    <form id="form" class="box" novalidate>
      <label for="amount">Сумма
        <div class="amount"><input id="amount" type="number" inputmode="decimal" step="any" min="{{MIN}}" value="{{AMOUNT}}" required><span id="sym">{{SYMBOL}}</span></div>
      </label>
      <div class="chips" id="chips" role="group" aria-label="Быстрый выбор суммы">{{CHIPS}}</div>
      <div class="hint" id="minhint">{{MINHINT}}</div>

      <fieldset>
        <legend>Способ оплаты</legend>
        <div class="methods" id="methods">{{METHODS}}</div>
      </fieldset>

      <label for="name">Ваше имя
        <input id="name" type="text" maxlength="30" placeholder="Аноним" autocomplete="nickname">
      </label>
      <label for="msg">Сообщение
        <textarea id="msg" maxlength="{{MAXLEN}}" placeholder="Что хотите сказать?"></textarea>
        <span class="hint"><span></span><span id="count">{{COUNT}}</span></span>
      </label>
      <div class="hp" aria-hidden="true"><label>Сайт<input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></label></div>
      <div id="ts"{{TS_CLASS}}></div>
      <p id="err" role="alert">{{ERR}}</p>
      <button class="pay" id="btn" type="submit"{{BTN_DISABLED}}>{{BTN}}</button>
    </form>

    <section id="payview" class="box" hidden aria-live="polite">
      <div id="checkout"></div>
      <div class="status"><span class="spin" aria-hidden="true"></span><span id="statustext">Ждём подтверждения платежа…</span></div>
      <button class="ghost" id="cancel" type="button">Изменить сумму или способ</button>
    </section>

    <section id="resultview" class="box result" hidden aria-live="polite">
      <div id="icon"></div>
      <h2 id="rtitle" tabindex="-1"></h2>
      <p id="rtext"></p>
      <button class="pay" id="again" type="button"></button>
    </section>

    <section class="faq" aria-labelledby="faq-title">
      <h2 id="faq-title">Частые вопросы</h2>
      <div class="faq-list">
        {{FAQ}}
      </div>
    </section>
  </main>
  <footer>
    {{LINKS}}
    <p>Имя и сообщение показываются в эфире стрима.</p>
  </footer>
</div>
<script type="application/json" id="cfg">{{CFG}}</script>

<script>
const $ = id => document.getElementById(id);
const state = { ts: null, tsId: null, cfg: null, donationId: null, idem: null, timer: null, started: 0, polling: false, amount: 0 };
const randKey = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");

// ───── экраны ─────
function show(view) {
  $("form").hidden = view !== "form";
  $("payview").hidden = view !== "pay";
  $("resultview").hidden = view !== "result";
}
function setError(t) { $("err").textContent = t || ""; }
function fmt(n) { return String(Number(n)).replace(".", ","); }

// ───── настройки страницы лежат в самом HTML (блок #cfg), отдельный запрос не нужен ─────
function init() {
  state.cfg = JSON.parse($("cfg").textContent);
  document.querySelectorAll("#chips button").forEach(b => { b.onclick = () => { $("amount").value = b.dataset.v; changed(); }; });
  document.querySelectorAll("input[name=method]").forEach(r => r.addEventListener("change", changed));
  changed(); updateCount();
  if (state.cfg.turnstile_site_key) initTurnstile(state.cfg.turnstile_site_key);
  const resume = new URLSearchParams(location.search).get("donation");
  if (resume && /^[0-9a-f]{32}$/.test(resume)) resumePayment(resume);
}

function amountValue() { return parseFloat(String($("amount").value).replace(",", ".")); }
function changed() {
  state.idem = null;  // другие параметры — другой платёж, нужен новый ключ идемпотентности
  updateButton();
}
function updateButton() {
  const a = amountValue();
  $("btn").textContent = a > 0 ? `Поддержать на ${fmt(a)} ${state.cfg ? state.cfg.symbol : "₽"}` : "Поддержать";
  document.querySelectorAll("#chips button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === a)));
}
function updateCount() { if (state.cfg) $("count").textContent = `${$("msg").value.length} / ${state.cfg.max_message_len}`; }
["amount", "name", "msg"].forEach(id => $(id).addEventListener("input", () => { changed(); updateCount(); }));

// ───── защита от ботов (Cloudflare Turnstile, если включена) ─────
function initTurnstile(siteKey) {
  const s = document.createElement("script");
  s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
  s.onload = () => {
    state.tsId = window.turnstile.render("#ts", {
      sitekey: siteKey, theme: "light", language: "ru",
      callback: t => { state.ts = t; },
      "expired-callback": () => { state.ts = null; },
      "error-callback": () => { state.ts = null; },
    });
  };
  s.onerror = () => setError("Не загрузилась проверка «я не робот». Обновите страницу или попробуйте другую сеть.");
  document.head.appendChild(s);
}
function resetTurnstile() {  // токен одноразовый: после каждой попытки нужен новый
  state.ts = null;
  if (state.tsId !== null && window.turnstile) window.turnstile.reset(state.tsId);
}

// ───── отправка формы ─────
let busy = false;
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (busy) return;
  const amount = amountValue();
  if (!(amount > 0)) return setError("Введите сумму числом");
  if (state.cfg && amount < state.cfg.min_amount) return setError(`Минимальная сумма — ${fmt(state.cfg.min_amount)} ${state.cfg.symbol}`);
  const method = (document.querySelector("input[name=method]:checked") || {}).value;
  if (!method) return setError("Выберите способ оплаты");

  if (state.cfg.turnstile_site_key && !state.ts) return setError("Подтвердите, что вы не робот, и нажмите ещё раз");
  busy = true; $("btn").disabled = true; setError("");
  $("btn").textContent = "Создаём платёж…";
  state.idem = state.idem || randKey();
  try {
    const r = await fetch("/api/donations", {
      method: "POST", headers: { "Content-Type": "application/json", "Idempotency-Key": state.idem },
      body: JSON.stringify({ method, amount, name: $("name").value, message: $("msg").value,
        website: $("website").value, turnstile_token: state.ts || "" }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status !== 409) state.idem = null;
      throw new Error(typeof d.detail === "string" ? d.detail : "Проверьте введённые данные");
    }
    state.amount = d.amount; state.donationId = d.donation_id;
    history.replaceState(null, "", "?donation=" + d.donation_id);
    show("pay");
    $("statustext").textContent = "Ждём подтверждения платежа…";
    await renderCheckout(d.checkout);
    startPolling();
  } catch (err) {
    // при сетевой ошибке ключ сохраняется: повторная отправка не создаст второй платёж
    setError(err && err.name === "TypeError" ? "Нет связи с сервером. Нажмите ещё раз — повторного списания не будет." : err.message);
  } finally {
    busy = false; $("btn").disabled = false; updateButton(); resetTurnstile();
  }
});

// ───── способы оплаты ─────
function loadScript(src) {
  return new Promise((res, rej) => {
    if (window.YooMoneyCheckoutWidget) return res();
    const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("script"));
    document.head.appendChild(s);
  });
}

function row(label, value, mono) {
  const wrap = document.createElement("div");
  const l = document.createElement("div"); l.className = "hint"; l.textContent = label;
  const v = document.createElement("div"); v.className = mono ? "addr" : "big"; v.textContent = value;
  wrap.append(l, v); return wrap;
}

async function renderCheckout(c) {
  const box = $("checkout"); box.replaceChildren();
  if (c.type === "widget") {
    const holder = document.createElement("div"); holder.id = "yk-form"; box.appendChild(holder);
    try {
      await loadScript("https://yookassa.ru/checkout-widget/v1/checkout-widget.js");
      const w = new window.YooMoneyCheckoutWidget({
        confirmation_token: c.confirmation_token, return_url: c.return_url,
        error_callback: () => showResult("failed"),
      });
      w.render("yk-form");
      try { w.on("complete", () => poll()); } catch (_) { /* события виджета необязательны: статус приходит опросом */ }
    } catch (_) { showResult("failed"); }
  } else if (c.type === "crypto_address") {
    const q = document.createElement("img"); q.className = "qr"; q.alt = "QR-код адреса для оплаты"; q.src = c.qr;
    box.append(q, row("Отправьте ровно", `${c.amount} ${c.currency}`), row("Сеть", c.network ? String(c.network).toUpperCase() : "—"),
      row("На адрес", c.address, true));
    if (c.memo) box.appendChild(row("Memo / тег (обязательно)", String(c.memo), true));
    const copy = document.createElement("button"); copy.type = "button"; copy.className = "pay"; copy.textContent = "Скопировать адрес";
    copy.onclick = async () => { try { await navigator.clipboard.writeText(c.address); copy.textContent = "Адрес скопирован"; } catch (_) { copy.textContent = "Выделите адрес вручную"; } };
    box.appendChild(copy);
    box.classList.add("checkout-stack");
  } else if (c.type === "link") {
    let ok = false; try { ok = new URL(c.url).protocol === "https:"; } catch (_) {}
    if (!ok) return showResult("failed");
    const p = document.createElement("p"); p.className = "sub checkout-note";
    p.textContent = "Оплата пройдёт в Telegram. Вернитесь на эту страницу: статус обновится сам.";
    const a = document.createElement("a"); a.className = "pay"; a.href = c.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = c.label || "Открыть Crypto Bot";
    box.classList.add("checkout-stack"); box.append(p, a);
  }
}

// ───── статус ─────
function startPolling() { stopPolling(); state.started = Date.now(); poll(); state.timer = setInterval(poll, 2500); }
function stopPolling() { if (state.timer) clearInterval(state.timer); state.timer = null; }

async function poll() {
  if (!state.donationId || state.polling) return;
  state.polling = true;
  try {
    const r = await fetch("/api/payments/status/" + state.donationId);
    if (r.status === 404) return showResult("missing");
    if (r.ok) {
      const s = await r.json(); state.amount = s.amount;
      if (s.status === "paid") return showResult("success");
      if (["canceled", "failed", "expired"].includes(s.status)) return showResult(s.status);
    }
  } catch (_) { /* временная ошибка сети: попробуем на следующем тике */ }
  finally { state.polling = false; }
  if (Date.now() - state.started > 25 * 60 * 1000) showResult("timeout");
}

function resumePayment(id) {
  state.donationId = id; show("pay");
  $("checkout").replaceChildren();
  $("statustext").textContent = "Проверяем платёж…";
  startPolling();
}

const RESULTS = {
  success: ["Спасибо! Донат получен", () => `${fmt(state.amount)} ${state.cfg.symbol} дошли до стрима. Сообщение скоро появится в эфире.`, "Поддержать ещё раз"],
  canceled: ["Оплата отменена", () => "Деньги не списаны. Можно попробовать ещё раз.", "Попробовать снова"],
  failed: ["Платёж не прошёл", () => "Деньги не списаны. Попробуйте другой способ оплаты.", "Попробовать снова"],
  expired: ["Время на оплату вышло", () => "Этот счёт больше не действует. Создайте новый платёж.", "Создать новый платёж"],
  timeout: ["Пока нет подтверждения", () => "Если вы уже заплатили, донат появится, как только платёж подтвердится. Страницу можно закрыть.", "Вернуться к форме"],
  missing: ["Платёж не найден", () => "Возможно, ссылка устарела. Начните заново.", "Начать заново"],
};

function showResult(kind) {
  stopPolling(); state.polling = false;
  const [title, text, btn] = RESULTS[kind] || RESULTS.failed;
  $("rtitle").textContent = title; $("rtext").textContent = text(); $("again").textContent = btn;
  $("icon").innerHTML = kind === "success"
    ? '<svg class="tick" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="30"/><path d="M28 43l10 10 19-21"/></svg>'
    : '<div class="cross" aria-hidden="true">×</div>';
  show("result"); $("rtitle").focus();
}

function reset() {
  stopPolling(); state.donationId = null; state.idem = null;
  history.replaceState(null, "", location.pathname);
  $("checkout").replaceChildren(); setError(""); show("form"); changed(); $("amount").focus();
}
$("again").addEventListener("click", reset);
$("cancel").addEventListener("click", reset);
init();
</script>
</body>
</html>
