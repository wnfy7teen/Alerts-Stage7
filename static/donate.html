<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{HEAD}}
<link rel="stylesheet" href="/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--page-bg:#101318;--card-bg:#1B2029;--field-bg:#11161E;--border:#343C49;--border-strong:#596474;--text-main:#F4F5F7;--text-muted:#A5AFBE;--accent:#E9A8C3;--button:#B35479;--button-hover:#A94F75}
body{min-height:100vh;margin:0;padding:42px 18px 32px;display:flex;justify-content:center;background:var(--page-bg);color:var(--text-main);font-family:"Onest",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{width:100%;max-width:560px}header{position:relative;padding:4px 4px 24px;margin-bottom:4px}header:after{content:"";display:block;width:54px;height:3px;margin-top:18px;background:var(--accent)}
h1{margin:0;color:var(--text-main);font-family:"Onest",system-ui,sans-serif;font-size:clamp(27px,6vw,34px);font-weight:800;line-height:1.14;letter-spacing:-.045em;overflow-wrap:anywhere}
.sub{margin:9px 0 0;color:var(--text-muted);font-size:15px;line-height:1.5}main{display:grid;gap:26px}
.box{display:grid;gap:22px;padding:26px;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;box-shadow:none}
label,legend{color:var(--text-main);font-size:15px;font-weight:700}label{display:grid;gap:10px}
fieldset{min-width:0;margin:0;padding:0;border:0;display:grid;gap:12px}legend{margin-bottom:12px;padding:0}
.amount{min-height:88px;display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--field-bg);border:1px solid var(--border-strong);border-radius:10px;transition:border-color .16s ease,box-shadow .16s ease}
.amount:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,168,195,.18)}
.amount input{width:100%;min-width:0;min-height:52px;padding:0;border:0!important;border-radius:0!important;outline:0!important;background:transparent!important;box-shadow:none!important;color:#FFF;font-family:"Unbounded",sans-serif;font-size:clamp(36px,9vw,48px);line-height:1.1;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;appearance:none;-webkit-appearance:none}
.amount span{flex:none;color:var(--accent);font-family:"Unbounded",sans-serif;font-size:clamp(36px,9vw,48px);line-height:1.1;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.chips button{min-width:0;min-height:46px;padding:9px 8px;border:1px solid var(--border-strong);border-radius:9px;background:#222933;color:var(--text-main);font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .16s ease,border-color .16s ease}
.chips button:hover{background:#303844;border-color:var(--accent)}.chips button[aria-pressed=true]{background:#38232D;border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(233,168,195,.20)}
.hint{display:flex;justify-content:space-between;gap:10px;color:var(--text-muted);font-size:13px;font-weight:400;line-height:1.45}#minhint{margin-top:-10px}
input[type=text],input[type=number],textarea{width:100%;min-width:0;padding:13px 14px;border:1px solid var(--border-strong);border-radius:9px;outline:none;background:var(--field-bg);color:var(--text-main);font:inherit;font-size:15px;font-weight:400;transition:border-color .16s ease,box-shadow .16s ease}
/* Keep the donation amount typography above the generic text-field reset. */
.amount input#amount{font-family:"Unbounded",sans-serif;font-size:clamp(36px,9vw,48px);line-height:1.1;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
input::placeholder,textarea::placeholder{color:#AAB7C9;opacity:1}
input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,168,195,.18)}
textarea{min-height:104px;resize:vertical;line-height:1.5}
.methods{display:grid;gap:10px}.method{position:relative;display:block}
.method input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.method .card{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px;border:1px solid var(--border-strong);border-radius:10px;background:#151A22;color:var(--text-main);cursor:pointer;transition:border-color .16s ease,background .16s ease}
.method .card>span:first-child{font-size:15px;font-weight:700;line-height:1.35}.method .card small{display:block;margin-top:3px;color:var(--text-muted);font-size:13px;font-weight:400;line-height:1.4}
.method .card:after{content:"";width:17px;height:17px;flex:0 0 17px;border:2px solid #8291A8;border-radius:50%;background:transparent}
.method:hover .card{border-color:var(--accent)}.method input:checked+.card{border:2px solid var(--accent);padding:12px 14px;background:#392329}
.method input:checked+.card:after{border:5px solid #E9A8C3;background:#392329}.method input:focus-visible+.card{outline:3px solid #F0B7CD;outline-offset:3px}
.pay{display:block;width:100%;min-height:58px;padding:15px 18px;border:1px solid var(--button);border-radius:10px;background:var(--button);color:#FFF;text-align:center;text-decoration:none;font:inherit;font-size:16px;font-weight:800;cursor:pointer;transition:background .16s ease,transform .16s ease}
.pay:hover:not(:disabled){background:var(--button-hover);transform:translateY(-1px)}.pay:disabled{opacity:.65;cursor:wait}
.ghost{min-height:44px;padding:10px;border:0;background:transparent;color:#F0B7CD;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#err{min-height:1.2em;margin:-8px 0 0;color:#FF9AA2;font-size:14px;line-height:1.45}.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.ts-on{min-height:65px}
.status{display:flex;align-items:center;gap:10px;color:var(--text-muted);line-height:1.45}.spin{width:18px;height:18px;flex:none;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#yk-form{min-height:120px;padding:4px;border-radius:12px;background:#FFF}.checkout-stack{display:grid;gap:14px}.checkout-note{margin:0;color:var(--text-muted);line-height:1.5}
.addr{padding:12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--field-bg);font-family:ui-monospace,Consolas,monospace;font-size:14px;overflow-wrap:anywhere}
.qr{display:block;width:min(200px,100%);height:auto;aspect-ratio:1;margin:0 auto;padding:8px;border-radius:10px;background:#FFF}
.big{color:#FFF;font-family:"Unbounded",sans-serif;font-size:clamp(19px,5vw,23px);font-weight:800;overflow-wrap:anywhere}
.result{text-align:center}.result h2{margin:8px 0;color:#FFF;font-family:"Unbounded",sans-serif;font-size:21px;line-height:1.35}.result p{margin:0 0 6px;color:var(--text-muted);line-height:1.55}
.tick{width:84px;height:84px;margin:0 auto}.tick circle{fill:none;stroke:#68D6A5;stroke-width:4;stroke-dasharray:190;stroke-dashoffset:190;animation:draw .7s ease forwards}.tick path{fill:none;stroke:#68D6A5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s .55s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}.cross{color:#FF8D96;font-size:56px;line-height:1}
.faq{padding:2px 4px 0}.faq-search{width:100%;min-height:44px;margin:0 0 12px;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--field-bg);color:var(--text-main);font:inherit;font-size:14px}.faq-search::placeholder{color:var(--text-muted)}.faq-search:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.faq-empty{margin:0;padding:12px 2px;color:var(--text-muted);font-size:14px;line-height:1.5}.faq h2{margin:0 0 14px;color:var(--text-main);font-family:"Onest",sans-serif;font-size:19px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.faq-list{border-top:1px solid var(--border)}.faq-item{border-bottom:1px solid var(--border)}
.faq-item summary{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 2px;color:var(--text-main);font-size:14px;font-weight:700;line-height:1.45;cursor:pointer;list-style:none}
.faq-item summary::-webkit-details-marker{display:none}.faq-item summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.faq-chevron{width:8px;height:8px;flex:0 0 8px;margin:0 4px 4px 0;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .18s ease}
.faq-item[open] .faq-chevron{margin-bottom:-4px;transform:rotate(225deg)}.faq-answer>div{overflow:hidden}
.faq-answer p{margin:0;padding:0 24px 16px 2px;color:var(--text-muted);font-size:14px;line-height:1.65}
.faq-item[open] .faq-answer{animation:faq-reveal .18s ease both}@keyframes faq-reveal{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
footer{margin-top:24px;padding:0 4px;color:var(--text-muted);font-size:13px;line-height:1.55}footer p{margin:10px 0 0}
.links{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 8px;padding:0;list-style:none}.links a{display:inline-block;padding:7px 0;color:#F0B7CD;font-weight:700;text-underline-offset:3px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #F0B7CD;outline-offset:3px}
@media(max-width:520px){body{padding:22px 13px 24px}header{padding:4px 3px 18px}.box{gap:18px;padding:19px 17px;border-radius:15px}.chips{grid-template-columns:repeat(2,minmax(0,1fr))}.chips button{min-height:48px}.method .card{min-height:64px;padding:12px}}
@media(max-width:380px){
  body{padding:18px 10px 20px}
  header{padding-bottom:16px}
  h1{font-size:27px}
  .box{gap:16px;padding:16px 13px;border-radius:12px}
  .amount{min-height:76px;gap:8px;padding:9px 12px}
  .amount input,.amount input#amount,.amount span{font-size:clamp(30px,8vw,38px)}
  .amount input{min-height:48px}
  .chips{gap:8px}
  .chips button{min-height:48px;padding:8px 6px;font-size:13px}
  .method .card{min-height:62px;gap:10px;padding:11px 12px}
  .method input:checked+.card{padding:10px 11px}
  .hint{font-size:12px}
  textarea{min-height:96px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* Keep the payment-pending indicator visibly animated: it communicates an active status. */
@media(prefers-reduced-motion:reduce){.spin{animation:spin 1s linear infinite!important}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="title">{{H1}}</h1>
    <p class="sub">Поддержать меня^^</p>
  </header>
  <noscript><p class="sub">Для оплаты нужен включённый JavaScript.</p></noscript>
  <main>
    <form id="form" class="box" novalidate>
      <label for="amount">Сумма
        <div class="amount"><input id="amount" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="{{AMOUNT}}" required><span id="sym">{{SYMBOL}}</span></div>
      </label>
      <div class="chips" id="chips" role="group" aria-label="Быстрый выбор суммы">{{CHIPS}}</div>
      <div class="hint" id="minhint">{{MINHINT}}</div>

      <fieldset>
        <legend>Способ оплаты</legend>
        <div class="methods" id="methods">{{METHODS}}</div>
      </fieldset>

      <label for="name">Ваше имя
        <input id="name" type="text" maxlength="30" placeholder="Аноним" autocomplete="nickname">
      </label>
      <label for="msg">Сообщение
        <textarea id="msg" maxlength="{{MAXLEN}}" placeholder="Что хотите сказать?"></textarea>
        <span class="hint"><span></span><span id="count">{{COUNT}}</span></span>
      </label>
      <div class="hp" aria-hidden="true"><label>Сайт<input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></label></div>
      <div id="ts"{{TS_CLASS}}></div>
      <p id="err" role="alert">{{ERR}}</p>
      <button class="pay" id="btn" type="submit"{{BTN_DISABLED}}>{{BTN}}</button>
    </form>

    <section id="payview" class="box" hidden aria-live="polite">
      <div id="checkout"></div>
      <div class="status"><span class="spin" aria-hidden="true"></span><span id="statustext">Ждём подтверждения платежа…</span></div>
      <button class="ghost" id="cancel" type="button">Изменить сумму или способ</button>
    </section>

    <section id="resultview" class="box result" hidden aria-live="polite">
      <div id="icon"></div>
      <h2 id="rtitle" tabindex="-1"></h2>
      <p id="rtext"></p>
      <button class="pay" id="again" type="button"></button>
    </section>

    <section class="faq" aria-labelledby="faq-title">
      <h2 id="faq-title">Частые вопросы</h2>
      <input class="faq-search" id="faq-search" type="search" placeholder="Найти ответ…" autocomplete="off" aria-label="Поиск по частым вопросам" aria-controls="faq-list">
      <p class="faq-empty" id="faq-empty" role="status" hidden>По этому запросу ничего не найдено. Попробуйте другие слова.</p>
      <div class="faq-list" id="faq-list">
        {{FAQ}}
      </div>
    </section>
  </main>
  <footer>
    {{LINKS}}
    <p>Имя и сообщение показываются в эфире стрима.</p>
  </footer>
</div>
<script type="application/json" id="cfg">{{CFG}}</script>

<script>
const $ = id => document.getElementById(id);
const state = { ts: null, tsId: null, cfg: null, donationId: null, idem: null, timer: null, started: 0, polling: false, amount: 0 };
const randKey = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");

// ───── экраны ─────
function show(view) {
  $("form").hidden = view !== "form";
  $("payview").hidden = view !== "pay";
  $("resultview").hidden = view !== "result";
}
function setError(t) { $("err").textContent = t || ""; }
function fmt(n) { return String(Number(n)).replace(".", ","); }

// ───── настройки страницы лежат в самом HTML (блок #cfg), отдельный запрос не нужен ─────
function init() {
  state.cfg = JSON.parse($("cfg").textContent);
  document.querySelectorAll("#chips button").forEach(b => { b.onclick = () => { $("amount").value = b.dataset.v; changed(); }; });
  document.querySelectorAll("input[name=method]").forEach(r => r.addEventListener("change", changed));
  changed(); updateCount(); initFaqSearch();
  if (state.cfg.turnstile_site_key) initTurnstile(state.cfg.turnstile_site_key);
  const resume = new URLSearchParams(location.search).get("donation");
  if (resume && /^[0-9a-f]{32}$/.test(resume)) resumePayment(resume);
}

function initFaqSearch() {
  const field = $("faq-search");
  const items = Array.from(document.querySelectorAll(".faq-item"));
  const empty = $("faq-empty");
  if (!field || !items.length || !empty) return;
  field.addEventListener("input", () => {
    const query = field.value.trim().toLocaleLowerCase("ru");
    let visible = 0;
    items.forEach(item => {
      const matches = !query || item.textContent.toLocaleLowerCase("ru").includes(query);
      item.hidden = !matches;
      if (matches) visible += 1;
    });
    empty.hidden = visible !== 0;
  });
}

function amountValue() {
  const raw = String($("amount").value).trim().replace(",", ".");
  // Reject partially valid strings such as "250abc" or "1.2.3" instead of
  // letting parseFloat silently turn them into a different donation amount.
  if (!/^\d+(?:\.\d{0,2})?$/.test(raw)) return NaN;
  const value = Number(raw);
  return Number.isFinite(value) ? value : NaN;
}
function changed() {
  state.idem = null;  // другие параметры — другой платёж, нужен новый ключ идемпотентности
  updateButton();
}
function updateButton() {
  const a = amountValue();
  $("btn").textContent = a > 0 ? `Поддержать на ${fmt(a)} ${state.cfg ? state.cfg.symbol : "₽"}` : "Поддержать";
  document.querySelectorAll("#chips button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === a)));
}
function updateCount() { if (state.cfg) $("count").textContent = `${$("msg").value.length} / ${state.cfg.max_message_len}`; }
["amount", "name", "msg"].forEach(id => $(id).addEventListener("input", () => { changed(); updateCount(); }));

// ───── защита от ботов (Cloudflare Turnstile, если включена) ─────
function initTurnstile(siteKey) {
  const s = document.createElement("script");
  s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
  s.onload = () => {
    state.tsId = window.turnstile.render("#ts", {
      sitekey: siteKey, theme: "light", language: "ru",
      callback: t => { state.ts = t; },
      "expired-callback": () => { state.ts = null; },
      "error-callback": () => { state.ts = null; },
    });
  };
  s.onerror = () => setError("Не загрузилась проверка «я не робот». Обновите страницу или попробуйте другую сеть.");
  document.head.appendChild(s);
}
function resetTurnstile() {  // токен одноразовый: после каждой попытки нужен новый
  state.ts = null;
  if (state.tsId !== null && window.turnstile) window.turnstile.reset(state.tsId);
}

// ───── отправка формы ─────
let busy = false;
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (busy) return;
  const amount = amountValue();
  if (!(amount > 0)) return setError("Введите сумму числом");
  if (state.cfg && amount < state.cfg.min_amount) return setError(`Минимальная сумма — ${fmt(state.cfg.min_amount)} ${state.cfg.symbol}`);
  const method = (document.querySelector("input[name=method]:checked") || {}).value;
  if (!method) return setError("Выберите способ оплаты");

  if (state.cfg.turnstile_site_key && !state.ts) return setError("Подтвердите, что вы не робот, и нажмите ещё раз");
  busy = true; $("btn").disabled = true; setError("");
  $("btn").textContent = "Создаём платёж…";
  state.idem = state.idem || randKey();
  try {
    const r = await fetch("/api/donations", {
      method: "POST", headers: { "Content-Type": "application/json", "Idempotency-Key": state.idem },
      body: JSON.stringify({ method, amount, name: $("name").value, message: $("msg").value,
        website: $("website").value, turnstile_token: state.ts || "" }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status !== 409) state.idem = null;
      throw new Error(typeof d.detail === "string" ? d.detail : "Проверьте введённые данные");
    }
    state.amount = d.amount; state.donationId = d.donation_id;
    history.replaceState(null, "", "?donation=" + d.donation_id);
    show("pay");
    $("statustext").textContent = "Ждём подтверждения платежа…";
    await renderCheckout(d.checkout);
    startPolling();
  } catch (err) {
    // при сетевой ошибке ключ сохраняется: повторная отправка не создаст второй платёж
    setError(err && err.name === "TypeError" ? "Нет связи с сервером. Нажмите ещё раз — повторного списания не будет." : err.message);
  } finally {
    busy = false; $("btn").disabled = false; updateButton(); resetTurnstile();
  }
});

// ───── способы оплаты ─────
function loadScript(src) {
  return new Promise((res, rej) => {
    if (window.YooMoneyCheckoutWidget) return res();
    const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("script"));
    document.head.appendChild(s);
  });
}

function row(label, value, mono) {
  const wrap = document.createElement("div");
  const l = document.createElement("div"); l.className = "hint"; l.textContent = label;
  const v = document.createElement("div"); v.className = mono ? "addr" : "big"; v.textContent = value;
  wrap.append(l, v); return wrap;
}

async function renderCheckout(c) {
  const box = $("checkout"); box.replaceChildren();
  if (c.type === "widget") {
    const holder = document.createElement("div"); holder.id = "yk-form"; box.appendChild(holder);
    try {
      await loadScript("https://yookassa.ru/checkout-widget/v1/checkout-widget.js");
      const w = new window.YooMoneyCheckoutWidget({
        confirmation_token: c.confirmation_token, return_url: c.return_url,
        error_callback: () => showResult("failed"),
      });
      w.render("yk-form");
      try { w.on("complete", () => poll()); } catch (_) { /* события виджета необязательны: статус приходит опросом */ }
    } catch (_) { showResult("failed"); }
  } else if (c.type === "crypto_address") {
    const q = document.createElement("img"); q.className = "qr"; q.alt = "QR-код адреса для оплаты"; q.src = c.qr;
    box.append(q, row("Отправьте ровно", `${c.amount} ${c.currency}`), row("Сеть", c.network ? String(c.network).toUpperCase() : "—"),
      row("На адрес", c.address, true));
    if (c.memo) box.appendChild(row("Memo / тег (обязательно)", String(c.memo), true));
    const copy = document.createElement("button"); copy.type = "button"; copy.className = "pay"; copy.textContent = "Скопировать адрес";
    copy.onclick = async () => { try { await navigator.clipboard.writeText(c.address); copy.textContent = "Адрес скопирован"; } catch (_) { copy.textContent = "Выделите адрес вручную"; } };
    box.appendChild(copy);
    box.classList.add("checkout-stack");
  } else if (c.type === "link") {
    let ok = false; try { ok = new URL(c.url).protocol === "https:"; } catch (_) {}
    if (!ok) return showResult("failed");
    const p = document.createElement("p"); p.className = "sub checkout-note";
    p.textContent = "Оплата пройдёт в Telegram. Вернитесь на эту страницу: статус обновится сам.";
    const a = document.createElement("a"); a.className = "pay"; a.href = c.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = c.label || "Открыть Crypto Bot";
    box.classList.add("checkout-stack"); box.append(p, a);
  }
}

// ───── статус ─────
function startPolling() { stopPolling(); state.started = Date.now(); poll(); state.timer = setInterval(poll, 2500); }
function stopPolling() { if (state.timer) clearInterval(state.timer); state.timer = null; }

async function poll() {
  if (!state.donationId || state.polling) return;
  state.polling = true;
  try {
    const r = await fetch("/api/payments/status/" + state.donationId);
    if (r.status === 404) return showResult("missing");
    if (r.ok) {
      const s = await r.json(); state.amount = s.amount;
      if (s.status === "paid") return showResult("success");
      if (["canceled", "failed", "expired"].includes(s.status)) return showResult(s.status);
    }
  } catch (_) { /* временная ошибка сети: попробуем на следующем тике */ }
  finally { state.polling = false; }
  if (Date.now() - state.started > 25 * 60 * 1000) showResult("timeout");
}

function resumePayment(id) {
  state.donationId = id; show("pay");
  $("checkout").replaceChildren();
  $("statustext").textContent = "Проверяем платёж…";
  startPolling();
}

const RESULTS = {
  success: ["Спасибо! Донат получен", () => `${fmt(state.amount)} ${state.cfg.symbol} дошли до стрима. Сообщение скоро появится в эфире.`, "Поддержать ещё раз"],
  canceled: ["Оплата отменена", () => "Деньги не списаны. Можно попробовать ещё раз.", "Попробовать снова"],
  failed: ["Платёж не прошёл", () => "Деньги не списаны. Попробуйте другой способ оплаты.", "Попробовать снова"],
  expired: ["Время на оплату вышло", () => "Этот счёт больше не действует. Создайте новый платёж.", "Создать новый платёж"],
  timeout: ["Пока нет подтверждения", () => "Если вы уже заплатили, донат появится, как только платёж подтвердится. Страницу можно закрыть.", "Вернуться к форме"],
  missing: ["Платёж не найден", () => "Возможно, ссылка устарела. Начните заново.", "Начать заново"],
};

function showResult(kind) {
  stopPolling(); state.polling = false;
  const [title, text, btn] = RESULTS[kind] || RESULTS.failed;
  $("rtitle").textContent = title; $("rtext").textContent = text(); $("again").textContent = btn;
  $("icon").innerHTML = kind === "success"
    ? '<svg class="tick" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="30"/><path d="M28 43l10 10 19-21"/></svg>'
    : '<div class="cross" aria-hidden="true">×</div>';
  show("result"); $("rtitle").focus();
}

function reset() {
  stopPolling(); state.donationId = null; state.idem = null;
  history.replaceState(null, "", location.pathname);
  $("checkout").replaceChildren(); setError(""); show("form"); changed(); $("amount").focus();
}
$("again").addEventListener("click", reset);
$("cancel").addEventListener("click", reset);
init();
</script>
</body>
