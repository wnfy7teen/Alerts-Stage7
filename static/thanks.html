<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Спасибо за донат</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; text-align: center;
    font-family: "Onest", system-ui, "Segoe UI", sans-serif; background:
      radial-gradient(ellipse at 15% 8%, rgba(126, 101, 255, .20), transparent 38%),
      radial-gradient(ellipse at 90% 75%, rgba(66, 151, 255, .13), transparent 34%), var(--bg); color: var(--text); }
  main { width: min(100%, 560px); padding: 42px; border: 1px solid rgba(190, 195, 238, .18); border-radius: 22px;
    background: linear-gradient(145deg, rgba(31, 35, 57, .86), rgba(15, 18, 31, .82));
    box-shadow: 0 22px 65px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
  h1 { letter-spacing: -.04em; background: linear-gradient(110deg, #fff 10%, #c9c1ff 58%, #91caff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  a { display: inline-block; margin-top: 8px; color: #c2b9ff; font-weight: 650; text-decoration: none;
    transition: color .18s ease, text-shadow .18s ease; }
  a:hover { color: #fff; text-shadow: 0 0 22px rgba(169,155,255,.45); }
  a:focus-visible { outline: 2px solid #bdb3ff; outline-offset: 5px; border-radius: 3px; }
  @media (max-width: 520px) { main { padding: 30px 22px; border-radius: 18px; } }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }


  /* High-contrast readable interface */

  body { background: #080B12; color: #F8FAFC; }
  main { background: #111827; border: 1px solid #40516B; border-radius: 16px; box-shadow: 0 12px 32px rgba(0,0,0,.32); backdrop-filter: none; -webkit-backdrop-filter: none; }
  h1 { color: #FFFFFF; background: none; -webkit-text-fill-color: #FFFFFF; letter-spacing: -.02em; }
  p { color: #CBD5E1; }
  a { color: #C4CEFF; text-decoration: underline; text-underline-offset: 4px; }
  a:hover { color: #FFFFFF; text-shadow: none; }
  a:focus-visible { outline: 3px solid #B9C5FF; outline-offset: 4px; }

</style>
</head>
<body>
<main>
  <h1>Спасибо за донат!</h1>
  <p><a href="/">Вернуться на страницу доната</a></p>
</main>
</body>
</html>
