<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Алерты донатов</title>
<link rel="stylesheet" href="/theme.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Onest", "Segoe UI", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; justify-content: center; align-items: flex-start;
    padding: 24px; box-sizing: border-box; }
  #card { display: none; flex-direction: column; align-items: center; gap: 14px; text-align: center;
    max-width: 680px; padding: 24px 32px; border-radius: 22px; color: var(--alert-text, #F1F2FA);
    background: linear-gradient(145deg, rgba(31, 35, 57, .96), rgba(12, 15, 28, .94));
    border: 1px solid color-mix(in srgb, var(--alert-accent, #A99BFF) 72%, rgba(190, 195, 238, .35));
    box-shadow: 0 22px 70px rgba(0, 0, 0, .42), 0 0 36px color-mix(in srgb, var(--alert-accent, #A99BFF) 24%, transparent),
      inset 0 1px 0 rgba(255, 255, 255, .09);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  #card.visible { display: flex; }
  #img.media-visible, #vid.media-visible { display: block; }
  #img, #vid { max-width: 100%; max-height: 300px; border-radius: 10px; display: none; }
  #title { font-size: var(--alert-size, 28px); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
  #msg { font-size: calc(var(--alert-size, 28px) * .72); line-height: 1.3; overflow-wrap: anywhere; opacity: .95; }
  #msg:empty { display: none; }

  .in-bounce { animation: bounceIn .8s cubic-bezier(.3, 1.6, .5, 1) both; }
  .in-slide  { animation: slideIn .6s cubic-bezier(.2, .9, .3, 1) both; }
  .in-zoom   { animation: zoomIn .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .in-fade   { animation: fadeIn .7s ease both; }
  .in-shake  { animation: fadeIn .3s ease both, shake .6s .3s ease; }
  .in-flip   { animation: flipIn .7s ease both; perspective: 800px; }
  .out       { animation: outAnim .5s ease forwards !important; }

  @keyframes bounceIn { from { transform: translateY(-160%) scale(.8); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes slideIn  { from { transform: translateX(-140%); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes zoomIn   { from { transform: scale(0); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes fadeIn   { from { opacity: 0 } to { opacity: 1 } }
  @keyframes flipIn   { from { transform: rotateX(90deg); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes shake    { 0%,100% { transform: none } 20% { transform: translateX(-14px) rotate(-1deg) }
                        40% { transform: translateX(14px) rotate(1deg) } 60% { transform: translateX(-9px) }
                        80% { transform: translateX(9px) } }
  @keyframes outAnim  { to { transform: translateY(-30px) scale(.92); opacity: 0 } }
  /* OBS Browser Source can report prefers-reduced-motion=reduce from the host OS.
     Do not collapse donation entrance/exit animations: these are an explicit alert setting. */


  /* High-contrast readable interface */

  #card { background: rgba(8, 13, 23, .97); border: 2px solid var(--alert-accent, #8EA2FF); border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,.55); backdrop-filter: none; -webkit-backdrop-filter: none; }
  #title { color: var(--alert-text, #FFFFFF); text-shadow: 0 2px 3px rgba(0,0,0,.65); }
  #msg { color: var(--alert-text, #FFFFFF); opacity: 1; text-shadow: 0 2px 3px rgba(0,0,0,.7); }

</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <img id="img" alt="">
    <video id="vid" muted loop playsinline></video>
    <div id="title"></div>
    <div id="msg"></div>
  </div>
</div>
<script>
const KEY = new URLSearchParams(location.search).get("key") || "";
const card = document.getElementById("card");
const img = document.getElementById("img");
const vid = document.getElementById("vid");
const queue = [];
const dynamicStyle = document.createElement("style");
dynamicStyle.nonce = document.currentScript.nonce;
document.head.appendChild(dynamicStyle);
const safeHex = value => /^#[0-9a-f]{6}$/i.test(value || "") ? value : "#0593C6";
let busy = false;

const sleep = ms => new Promise(r => setTimeout(r, ms));

let reconnectDelay = 1000;
let reconnectTimer = null;
const seenAlertIds = new Set();
const seenAlertOrder = [];

function rememberAlert(id) {
  if (!id) return true;
  if (seenAlertIds.has(id)) return false;
  seenAlertIds.add(id);
  seenAlertOrder.push(id);
  if (seenAlertOrder.length > 500) seenAlertIds.delete(seenAlertOrder.shift());
  return true;
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws?key=${encodeURIComponent(KEY)}`);

  ws.onopen = () => {
    reconnectDelay = 1000;
  };

  ws.onmessage = e => {
    try {
      const alert = JSON.parse(e.data);
      if (!alert || typeof alert !== "object" || Array.isArray(alert)) return;
      if (!rememberAlert(alert.id)) return;
      queue.push(alert);
      next();
    } catch (_) {
      console.warn("Получено некорректное сообщение WebSocket");
    }
  };

  ws.onclose = () => {
    if (reconnectTimer !== null) return;
    const jitter = Math.random() * Math.min(1000, reconnectDelay * 0.2);
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connect();
    }, reconnectDelay + jitter);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  };

  ws.onerror = () => ws.close();
}

function playAudio(url, volume, maxMs) {
  return new Promise(resolve => {
    const a = new Audio(url);
    a.volume = volume;
    const done = () => resolve();
    a.onended = done; a.onerror = done;
    setTimeout(done, maxMs);
    a.play().catch(done);
  });
}

function chime(volume) {  // встроенный сигнал, если свой звук не выбран
  return new Promise(resolve => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [660, 880].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; o.type = "sine";
        g.gain.setValueAtTime(0.0001, ctx.currentTime + i * .18);
        g.gain.exponentialRampToValueAtTime(Math.max(volume * .5, .0002), ctx.currentTime + i * .18 + .03);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * .18 + .4);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + i * .18); o.stop(ctx.currentTime + i * .18 + .45);
      });
    } catch (e) {}
    setTimeout(resolve, 700);
  });
}

function speak(text, volume, rate) {  // запасной вариант, если серверная озвучка не получилась
  return new Promise(resolve => {
    if (!("speechSynthesis" in window) || !text) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ru-RU"; u.volume = volume; u.rate = 1 + rate / 100;
    u.onend = u.onerror = () => resolve();
    setTimeout(resolve, 30000);
    speechSynthesis.speak(u);
  });
}

async function show(a) {
  const accent = safeHex(a.color);
  const textColor = "#FFFFFF";
  const size = Math.max(12, Math.min(80, Number(a.font_size) || 28));
  dynamicStyle.textContent = "#card { --alert-accent: " + accent + "; --alert-text: " + textColor + "; --alert-size: " + size + "px; }";
  document.getElementById("title").textContent = a.title;
  document.getElementById("msg").textContent = a.message;

  img.classList.remove("media-visible"); vid.classList.remove("media-visible");
  img.removeAttribute("src"); vid.removeAttribute("src");
  if (a.image) {
    const isVideo = /\.(webm|mp4)$/i.test(a.image);
    const m = isVideo ? vid : img;
    m.src = a.image;
    m.classList.add("media-visible");
    if (isVideo) vid.play().catch(() => {});
  }

  const started = Date.now();
  card.className = "visible";
  void card.offsetWidth;  // перезапуск анимации
  card.className = "visible in-" + a.animation;

  (a.sound ? playAudio(a.sound, a.sound_volume, 8000) : chime(a.sound_volume)).then(async () => {
    if (a.tts_url) await playAudio(a.tts_url, a.tts_volume, 40000);
    else if (a.tts_text) await speak(a.tts_text, a.tts_volume, a.tts_rate);
  }).then(() => { a._audioDone = true; });

  // ждём минимальное время показа и окончания озвучки
  await sleep(a.duration * 1000);
  while (!a._audioDone && Date.now() - started < 60000) await sleep(200);

  card.className = "out";
  await sleep(550);
  card.className = "";
  vid.pause();
}

async function next() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    try { await show(queue.shift()); } catch (e) { console.error(e); }
    await sleep(600);
  }
  busy = false;
}

connect();
</script>
</body>
</html>
