# Запуск: docker compose up -d --build
# Нужен файл .env рядом (см. .env.example) и значения DOMAIN и ACME_EMAIL в нём.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:  # эти значения важнее .env: за Caddy они всегда такие
      HOST: 0.0.0.0
      DB_PATH: /data/donations.db
      CONFIG_PATH: /data/config.json
      MEDIA_DIR: /data/media
      TRUST_PROXY_HEADERS: "1"
      FORCE_HTTPS: "1"
    volumes:
      - app-data:/data
    expose:
      - "8000"          # наружу не публикуется: доступ только через Caddy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?укажите ACME_EMAIL в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  backup:                # ежедневная копия базы в том backups (хранится 14 последних)
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "while true; do python scripts/backup.py /backups; sleep 86400; done"]
    environment:
      DB_PATH: /data/donations.db
      CONFIG_PATH: /data/config.json
    volumes:
      - app-data:/data      # нужен доступ на запись: SQLite создаёт служебные файлы рядом с базой
      - backups:/backups
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  app-data:
  backups:
  caddy-data:
  caddy-config:
